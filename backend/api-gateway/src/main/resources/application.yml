server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: participation-service
          uri: http://localhost:8081
          predicates:
            - Path=/participation-service/**
          filters:
            - StripPrefix=1

        - id: activity-service
          uri: http://localhost:8086
          predicates:
            - Path=/activity-service/**
          filters:
            - StripPrefix=1

        - id: feedback-service
          uri: http://localhost:8085
          predicates:
            - Path=/feedback-service/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*" 
            allowCredentials: true 
            maxAge: 3600 